<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dump Code Frontend — Login</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; padding: 2rem; background:#f7f9fc; color:#222 }
        .card { max-width:420px; margin:2rem auto; background:white; padding:1.25rem 1.5rem; border-radius:8px; box-shadow:0 6px 18px rgba(18,38,63,0.08)}
        label { display:block; margin-top:0.75rem; font-size:0.9rem }
        input[type="email"], input[type="password"] { width:100%; padding:0.6rem 0.75rem; margin-top:0.35rem; border:1px solid #d6dde6; border-radius:6px; font-size:1rem }
        button { margin-top:1rem; width:100%; padding:0.75rem; border-radius:6px; border:0; background:#0b74de; color:white; font-weight:600; cursor:pointer }
        .msg { margin-top:1rem; padding:0.75rem; border-radius:6px }
        .msg.success { background:#e6fbf3; color:#06683b }
        .msg.error { background:#fff1f2; color:#8a1f2a }
        .hint { font-size:0.85rem; color:#556070; margin-top:0.5rem }
    </style>
</head>
<body>
    <div class="card">
        <h1 style="margin:0 0 0.5rem 0; font-size:1.25rem">Login</h1>
        <p class="hint">Use the preset credentials to be accepted.</p>

        <form id="loginForm" novalidate>
            <label for="emailInput">Email</label>
            <input id="emailInput" type="email" value="#" required autocomplete="username">

            <label for="passwordInput">Password</label>
            <input id="passwordInput" type="password" value="#" required autocomplete="current-password">

            <button type="submit">Sign in</button>
        </form>

        <div id="message" aria-live="polite"></div>
    </div>

    <script>
        // Preset credentials
        const PRESET_EMAIL = 'dump@123.com';
        const PRESET_PASSWORD = '12345';

        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const messageEl = document.getElementById('message');

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'msg ' + (type === 'success' ? 'success' : 'error');
        }

        form.addEventListener('submit', function (ev) {
            ev.preventDefault();
            const email = (emailInput.value || '').trim();
            const pass = passwordInput.value || '';

            if (!email || !pass) {
                showMessage('Please enter both email and password.', 'error');
                return;
            }

            if (email === PRESET_EMAIL && pass === PRESET_PASSWORD) {
                showMessage('Accepted — credentials match the preset.', 'success');
                // Optionally disable the form after success
                emailInput.disabled = true;
                passwordInput.disabled = true;
            } else {
                showMessage('Invalid credentials. Try the preset email and password.', 'error');
            }
        });
    </script>
</body>
</html>
